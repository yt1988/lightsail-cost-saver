name: Publish Docker image

# Builds the nginx image for amd64 and arm64 and pushes it to Docker Hub.
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      HAS_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Skip when Docker Hub secrets are not set
        if: env.HAS_CREDS != 'true'
        run: echo "::notice::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to publish the image."

      - uses: actions/checkout@v4
        if: env.HAS_CREDS == 'true'

      - uses: docker/setup-qemu-action@v3
        if: env.HAS_CREDS == 'true'

      - uses: docker/setup-buildx-action@v3
        if: env.HAS_CREDS == 'true'

      - uses: docker/login-action@v3
        if: env.HAS_CREDS == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        if: env.HAS_CREDS == 'true'
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/lightsail-cost-saver
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        if: env.HAS_CREDS == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
