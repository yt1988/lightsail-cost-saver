name: Publish Docker image

# Builds the nginx image for amd64 and arm64 and pushes it to Docker Hub.
# Needs a Docker Hub access token in the repository secret DOCKERHUB_TOKEN (IMXJP is accepted too).
# The Docker Hub user defaults to imxjp; set a DOCKERHUB_USERNAME secret to push somewhere else.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME || 'imxjp' }}
      HAS_CREDS: ${{ secrets.DOCKERHUB_TOKEN != '' || secrets.IMXJP != '' }}
    steps:
      - name: Skip when Docker Hub secrets are not set
        if: env.HAS_CREDS != 'true'
        run: echo "::warning::Add a DOCKERHUB_TOKEN repository secret (Docker Hub access token) to publish the image."

      - uses: actions/checkout@v4
        if: env.HAS_CREDS == 'true'

      - uses: docker/setup-qemu-action@v3
        if: env.HAS_CREDS == 'true'

      - uses: docker/setup-buildx-action@v3
        if: env.HAS_CREDS == 'true'

      - uses: docker/login-action@v3
        if: env.HAS_CREDS == 'true'
        with:
          username: ${{ env.DH_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.IMXJP }}

      - id: meta
        uses: docker/metadata-action@v5
        if: env.HAS_CREDS == 'true'
        with:
          images: ${{ env.DH_USER }}/lightsail-cost-saver
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        if: env.HAS_CREDS == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
