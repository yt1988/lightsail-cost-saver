server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  charset_types text/plain application/json application/javascript;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy no-referrer;

  # agent-facing files: readable from any origin
  location ~ ^/(calc\.js|prices\.json|llms\.txt)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
  }

  # header rules for Cloudflare/Netlify, not content
  location = /_headers { return 404; }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
